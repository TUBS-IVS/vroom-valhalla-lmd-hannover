# Full-coverage sweep config for `batch-delivery oracle-loop`.
#
# - All seven LSPs (provider feature lets the MLP learn provider-specific
#   hub topology / fleet-mix effects).
# - All six operational weekdays (day_idx feature).
# - All PLZs in the HAGRID demand layer (plzs: null = auto-resolve).
# - Modest base perturbation grid; the oracle-loop's variance-curriculum
#   widens it per iteration (--variance-growth, --variance-max-extra).
# - max_combinations + shuffle_seed are set per iteration by the oracle-loop
#   command itself; the values here only matter for a one-off `sweep` call.
providers: [DHL, Amazon, DPD, FedEx, GLS, Hermes, UPS]
base_days: [0, 1, 2, 3, 4, 5]
agg_ks: [1, 2, 3]
plzs: null

scales: [0.7, 1.0, 1.3]
p_keeps: [1.0, 0.9]
noise_sigmas: [0.0, 0.2]
seeds: [42, 123, 456]

out_dir: results/sweep_oracle_full
out_csv: training_matrix.csv
parallel_jobs: 8
parallel_backend: threading
use_cache: true
progress: true

min_parcels: 1
min_stops: 2
