# Multi-provider training sweep — all 7 KEP carriers in Region Hannover.
#
# Use for full ML-training data generation:
#   batch-delivery sweep -c conf/sweep_multi_provider.yaml --jobs 8
#
# Grid size: 7 × 6 × 3 × ~50 × 3 × 2 × 2 × 3  ≈ 230 000 combinations.
# Cap with --max for smoke runs, or shrink the lists below.

providers: [Amazon, DHL, DPD, FedEx, GLS, Hermes, UPS]
base_days: [0, 1, 2, 3, 4, 5]
agg_ks: [1, 2, 3]
plzs: null

scales:       [0.7, 1.0, 1.3]
p_keeps:      [1.0, 0.9]
noise_sigmas: [0.0, 0.2]
seeds:        [42, 123, 456]

out_dir: results/sweep_multi
out_csv: training_matrix.csv
out_parquet: training_matrix.parquet

max_combinations: null
parallel_jobs: 8
parallel_backend: threading
use_cache: true
progress: true

min_parcels: 1
min_stops: 2
